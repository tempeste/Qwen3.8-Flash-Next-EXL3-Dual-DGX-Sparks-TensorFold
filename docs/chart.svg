<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.t{fill:#1f2328}.m{fill:#59636e}.a{fill:#9aa4b0}.b{fill:#2f81f7}
@media (prefers-color-scheme: dark){.t{fill:#e6edf3}.m{fill:#9198a1}.a{fill:#5d6672}.b{fill:#4493f8}}
</style>
<text x="0" y="22" class="t" font-size="17" font-weight="600">Single-Spark recipe vs this recipe (two DGX Sparks, lab)</text>
<g font-size="13">
<text x="0" y="62" class="t">Decode, 8 conversations</text>
<rect x="230" y="48" width="323" height="16" rx="3" class="a"/><text x="559" y="61" class="m">193 tok/s</text>
<rect x="230" y="68" width="450" height="16" rx="3" class="b"/><text x="686" y="81" class="t" font-weight="600">269 tok/s</text>
<text x="0" y="132" class="t">Decode, peak</text>
<rect x="230" y="118" width="240" height="16" rx="3" class="a"/><text x="476" y="131" class="m">202 tok/s</text>
<rect x="230" y="138" width="450" height="16" rx="3" class="b"/><text x="686" y="151" class="t" font-weight="600">378 tok/s</text>
<text x="0" y="202" class="t">Prompt reading, 4K tokens</text>
<rect x="230" y="188" width="259" height="16" rx="3" class="a"/><text x="495" y="201" class="m">2,239 tok/s</text>
<rect x="230" y="208" width="450" height="16" rx="3" class="b"/><text x="686" y="221" class="t" font-weight="600">3,893 tok/s</text>
<text x="0" y="272" class="t">Prompt reading, 262K tokens</text>
<text x="230" y="271" class="m">does not fit</text>
<rect x="230" y="278" width="418" height="16" rx="3" class="b"/><text x="654" y="291" class="t" font-weight="600">3,612 tok/s</text>
<text x="0" y="342" class="t">Agent load, decode</text>
<rect x="230" y="328" width="130" height="16" rx="3" class="a"/><text x="366" y="341" class="m">30 tok/s</text>
<rect x="230" y="348" width="450" height="16" rx="3" class="b"/><text x="686" y="361" class="t" font-weight="600">104 tok/s</text>
</g>
<g font-size="12">
<rect x="0" y="402" width="12" height="12" rx="2" class="a"/><text x="18" y="413" class="m">MiaAI-Lab's single-Spark recipe, a copy on each Spark (10 × 262,144 tokens)</text>
<rect x="0" y="422" width="12" height="12" rx="2" class="b"/><text x="18" y="433" class="m">this recipe, one engine across both Sparks (24 × 409,600 tokens)</text>

<text x="0" y="458" class="m">Peak: the single-Spark recipe serves 10 at once. Agent load: 16 conversations at once, the single-Spark recipe at 8 × 163,840.</text>
</g>
</svg>
